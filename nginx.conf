user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream ktor_backend {
        server ktor-backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend Static Files (React PWA)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # Cache settings for PWA stability
            location ~* \.(?:html|json|txt|xml)$ {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
                expires -1;
            }

            # Cache settings for static assets (Vite output has hash in filename)
            location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|svg|ico|webmanifest)$ {
                add_header Cache-Control "max-age=31536000, public, immutable";
                expires 1y;
            }
        }

        # Ktor API Routes
        location /api/ {
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Max upload size for photo scans & recipe pictures
            client_max_body_size 10M;
        }

        # Ktor Auth Routes
        location /auth/ {
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket connection for sync
        location /ws/ {
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Authenticated Photos Access
        location /photos/ {
            # Nginx requests auth validation from Ktor
            auth_request /api/photos/verify;
            
            alias /data/photos/;
            expires 30d;
            add_header Cache-Control "private, no-transform";
            
            # Ensure proper content type
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
            }
        }

        # Internal route for Nginx to perform JWT verify call to Ktor
        location = /api/photos/verify {
            internal;
            proxy_pass http://ktor_backend/api/photos/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie; # Pass the authentication cookies
        }
    }
}
